services:
  - type: web
    name: aioclips-private-studio
    runtime: docker
    plan: starter
    healthCheckPath: /v1/health
    dockerfilePath: ./Dockerfile
    disk:
      name: aioclips-media
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: STUDIO_ACCESS_TOKEN
        generateValue: true
      - key: STUDIO_DATA_DIR
        value: /data
