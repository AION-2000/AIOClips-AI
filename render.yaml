# Optional Render Blueprint for the original-story MVP.
# AIOClips has already been deployed manually as a Free web service.
# Free services sleep after inactivity and use ephemeral storage.
services:
  - type: web
    name: aioclips-original-story
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: STUDIO_ACCESS_TOKEN
        sync: false # Enter a new strong private token in the Render dashboard.
      - key: STORY_TTL_SECONDS
        value: "1800"
