name: Feature request
description: Propose an improvement to the private video studio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: Describe the expected inputs, outputs and review flow.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How can the behavior be tested with authorized or synthetic media?
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights and safety
      options:
        - label: This feature does not depend on bypassing ownership, DRM, or media access controls.
          required: true
